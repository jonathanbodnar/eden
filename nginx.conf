server {
    listen 3000;
    server_name projectedin.com www.projectedin.com;
    return 301 https://$host$request_uri;
}

server {
    listen 3443 ssl;
    server_name projectedin.com www.projectedin.com;

    ssl_certificate /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_redirect http://projectedin.com/ https://projectedin.com/;
        proxy_redirect http://www.projectedin.com/ https://www.projectedin.com/;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    location /world-api/ {
        proxy_pass http://world-api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_redirect http://projectedin.com/ https://projectedin.com/world-api/;
        proxy_redirect http://www.projectedin.com/ https://www.projectedin.com/world-api/;
    }

    location / {
        proxy_pass http://world-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
